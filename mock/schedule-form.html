<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>予定登録/編集 - 画面モック</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__row">
        <div class="brand">
          <div class="brand__title">予定登録/編集</div>
          <div class="brand__subtitle">勤務予定管理 / UI mock</div>
        </div>
        <nav class="nav">
          <a class="nav__link" href="./index.html">ホーム</a>
          <a class="nav__link" href="./members.html">メンバー一覧</a>
          <a class="nav__link" href="./schedules.html">予定一覧</a>
          <a class="nav__link" href="./monthly.html">月次集計</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="alert" data-alert></div>
        <div class="split">
          <div>
            <h1 class="h1" id="title">予定登録</h1>
            <div class="toolbar">
              <div class="field">
                <label for="userId">メンバー（必須）</label>
                <select id="userId"></select>
              </div>
              <div class="field">
                <label for="targetDate">日付（必須）</label>
                <input id="targetDate" type="date" />
              </div>
              <div class="field">
                <label for="statusTypeId">勤務区分（必須）</label>
                <select id="statusTypeId"></select>
              </div>
              <div class="field">
                <label for="startTime">開始時刻</label>
                <input id="startTime" type="time" step="60" />
              </div>
              <div class="field">
                <label for="endTime">終了時刻</label>
                <input id="endTime" type="time" step="60" />
              </div>
              <div class="field" style="min-width: 100%">
                <label for="comment">コメント</label>
                <textarea id="comment" placeholder="任意"></textarea>
              </div>
            </div>

            <div class="actions" style="margin-top: 14px">
              <button class="btn btn--primary" id="submit">登録</button>
              <a class="btn" href="./schedules.html">キャンセル</a>
            </div>
          </div>

          <aside class="card" style="margin: 0">
            <h2 class="h2">送信イメージ（JSON）</h2>
            <pre
              style="
                margin: 0;
                white-space: pre-wrap;
                word-break: break-word;
                font-family: var(--mono);
                color: rgba(255, 255, 255, 0.86);
              "
              id="payload"
            ></pre>
            <p class="muted" style="margin: 10px 0 0">
              編集時は <code>PUT /schedules/{id}</code>、新規は <code>POST /schedules</code> の想定。
            </p>
          </aside>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__row">
        <span class="muted">mock/schedule-form.html</span>
        <a class="link" href="./index.html">ホーム</a>
      </div>
    </footer>

    <script type="module">
      import { schedules, users, workStatusTypes } from "./mock-data.js";
      import { fillSelect, qs, readQuery, setAlert } from "./ui.js";

      const title = qs("#title");
      const userId = qs("#userId");
      const targetDate = qs("#targetDate");
      const statusTypeId = qs("#statusTypeId");
      const startTime = qs("#startTime");
      const endTime = qs("#endTime");
      const comment = qs("#comment");
      const submit = qs("#submit");
      const payload = qs("#payload");

      fillSelect(userId, users, { valueKey: "id", labelKey: "name", includeEmpty: "選択してください" });
      fillSelect(statusTypeId, workStatusTypes, {
        valueKey: "id",
        labelKey: "statusName",
        includeEmpty: "選択してください",
      });

      const query = readQuery();
      const editId = query.editId ? Number(query.editId) : null;
      const editing = editId ? schedules.find((s) => s.id === editId) : null;

      function toApiTime(v) {
        if (!v) return null;
        return `${v}:00`;
      }

      function fromApiTime(v) {
        if (!v) return "";
        return String(v).slice(0, 5);
      }

      if (editing) {
        title.textContent = `予定編集 (ID=${editing.id})`;
        submit.textContent = "更新";
        userId.value = String(editing.userId);
        targetDate.value = editing.targetDate;
        statusTypeId.value = String(editing.statusTypeId);
        startTime.value = fromApiTime(editing.startTime);
        endTime.value = fromApiTime(editing.endTime);
        comment.value = editing.comment ?? "";
      } else {
        if (query.userId) userId.value = query.userId;
        if (query.date) targetDate.value = query.date;
      }

      function buildPayload() {
        return {
          userId: userId.value ? Number(userId.value) : null,
          targetDate: targetDate.value || null,
          statusTypeId: statusTypeId.value ? Number(statusTypeId.value) : null,
          startTime: toApiTime(startTime.value),
          endTime: toApiTime(endTime.value),
          comment: comment.value || "",
        };
      }

      function validate(p) {
        if (!p.userId) return "メンバーは必須です。";
        if (!p.targetDate) return "日付は必須です。";
        if (!p.statusTypeId) return "勤務区分は必須です。";
        if (p.startTime && p.endTime && p.startTime > p.endTime) return "開始時刻 <= 終了時刻にしてください。";
        return "";
      }

      function renderPayload() {
        const p = buildPayload();
        payload.textContent = JSON.stringify(p, null, 2);
      }

      for (const el of [userId, targetDate, statusTypeId, startTime, endTime, comment]) {
        el.addEventListener("input", renderPayload);
        el.addEventListener("change", renderPayload);
      }

      submit.addEventListener("click", () => {
        setAlert("");
        const p = buildPayload();
        const message = validate(p);
        if (message) {
          setAlert(message);
          return;
        }
        if (editing) {
          setAlert(`PUT /schedules/${editing.id}（モック）: 200 OK`);
        } else {
          setAlert("POST /schedules（モック）: 201 Created");
        }
      });

      renderPayload();
    </script>
  </body>
</html>

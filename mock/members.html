<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>メンバー一覧 - 画面モック</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__row">
        <div class="brand">
          <div class="brand__title">メンバー一覧</div>
          <div class="brand__subtitle">勤務予定管理 / UI mock</div>
        </div>
        <nav class="nav">
          <a class="nav__link" href="./index.html">ホーム</a>
          <a class="nav__link" href="./schedules.html">予定一覧</a>
          <a class="nav__link" href="./schedule-form.html">予定登録</a>
          <a class="nav__link" href="./monthly.html">月次集計</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <div class="field">
            <label for="teamId">チーム</label>
            <select id="teamId"></select>
          </div>
          <button class="btn" id="reset">リセット</button>
          <span class="pill"><b>ヒント</b> 行クリックで予定一覧へ</span>
        </div>
      </section>

      <section class="card">
        <div class="alert" data-alert></div>
        <table class="table">
          <thead>
            <tr>
              <th>名前</th>
              <th>社員番号</th>
              <th>チーム</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__row">
        <span class="muted">mock/members.html</span>
        <a class="link" href="./index.html">ホーム</a>
      </div>
    </footer>

    <script type="module">
      import { teams, users, teamById } from "./mock-data.js";
      import { fillSelect, qs, readQuery, renderTable, setAlert } from "./ui.js";

      const teamSelect = qs("#teamId");
      const tbody = qs("#tbody");
      const reset = qs("#reset");

      fillSelect(teamSelect, teams, {
        valueKey: "id",
        labelKey: "name",
        includeEmpty: "全チーム",
      });

      const query = readQuery();
      if (query.teamId) teamSelect.value = query.teamId;

      function filteredUsers() {
        const teamId = teamSelect.value ? Number(teamSelect.value) : null;
        return users.filter((u) => (teamId ? u.teamId === teamId : true));
      }

      function render() {
        setAlert("");
        const rows = filteredUsers();
        if (rows.length === 0) {
          setAlert("該当するメンバーがいません。");
        }
        renderTable(
          tbody,
          rows
            .map((u) => {
              const team = teamById(u.teamId);
              return `
                <tr data-user-id="${u.id}">
                  <td>${u.name}</td>
                  <td><code>${u.employeeCode}</code></td>
                  <td>${team ? team.name : "-"}</td>
                  <td class="actions">
                    <a class="link" href="./schedules.html?userId=${u.id}">予定へ</a>
                    <a class="link" href="./monthly.html?teamId=${u.teamId}">集計へ</a>
                  </td>
                </tr>
              `;
            })
            .join("")
        );
      }

      teamSelect.addEventListener("change", render);
      reset.addEventListener("click", () => {
        teamSelect.value = "";
        render();
      });

      tbody.addEventListener("click", (event) => {
        const row = event.target.closest("tr[data-user-id]");
        if (!row) return;
        const userId = row.getAttribute("data-user-id");
        window.location.href = `./schedules.html?userId=${encodeURIComponent(userId)}`;
      });

      render();
    </script>
  </body>
</html>

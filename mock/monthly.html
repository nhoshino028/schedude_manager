<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>月次集計 - 画面モック</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="container topbar__row">
        <div class="brand">
          <div class="brand__title">月次集計</div>
          <div class="brand__subtitle">勤務予定管理 / UI mock</div>
        </div>
        <nav class="nav">
          <a class="nav__link" href="./index.html">ホーム</a>
          <a class="nav__link" href="./members.html">メンバー一覧</a>
          <a class="nav__link" href="./schedules.html">予定一覧</a>
          <a class="nav__link" href="./schedule-form.html">予定登録</a>
        </nav>
      </div>
    </header>

    <main class="container">
      <section class="card">
        <div class="toolbar">
          <div class="field">
            <label for="yearMonth">年月（必須）</label>
            <input id="yearMonth" type="month" />
          </div>
          <div class="field">
            <label for="teamId">チーム（任意）</label>
            <select id="teamId"></select>
          </div>
          <button class="btn btn--primary" id="show">表示</button>
          <button class="btn" id="reset">リセット</button>
        </div>
      </section>

      <section class="card">
        <div class="alert" data-alert></div>
        <table class="table">
          <thead>
            <tr>
              <th>名前</th>
              <th>出社</th>
              <th>在宅</th>
              <th>休暇</th>
              <th>午前休</th>
              <th>午後休</th>
              <th>欠勤</th>
              <th>更新日時</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
      </section>
    </main>

    <footer class="footer">
      <div class="container footer__row">
        <span class="muted">mock/monthly.html</span>
        <a class="link" href="./index.html">ホーム</a>
      </div>
    </footer>

    <script type="module">
      import { teams, users } from "./mock-data.js";
      import { fillSelect, qs, readQuery, renderTable, setAlert } from "./ui.js";

      const yearMonth = qs("#yearMonth");
      const teamId = qs("#teamId");
      const show = qs("#show");
      const reset = qs("#reset");
      const tbody = qs("#tbody");

      fillSelect(teamId, teams, { valueKey: "id", labelKey: "name", includeEmpty: "全チーム" });

      const query = readQuery();
      if (query.teamId) teamId.value = query.teamId;

      function nowIso() {
        const d = new Date();
        const pad = (n) => String(n).padStart(2, "0");
        const tz = -d.getTimezoneOffset();
        const sign = tz >= 0 ? "+" : "-";
        const hh = pad(Math.floor(Math.abs(tz) / 60));
        const mm = pad(Math.abs(tz) % 60);
        return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(
          d.getMinutes()
        )}:${pad(d.getSeconds())}${sign}${hh}:${mm}`;
      }

      function validate() {
        if (!yearMonth.value) return "年月は必須です。";
        return "";
      }

      function filteredUsers() {
        const tid = teamId.value ? Number(teamId.value) : null;
        return users.filter((u) => (tid ? u.teamId === tid : true));
      }

      function render() {
        const message = validate();
        setAlert(message);
        if (message) {
          tbody.innerHTML = "";
          return;
        }

        const rows = filteredUsers();
        if (rows.length === 0) setAlert("該当するメンバーがいません。");

        const ym = yearMonth.value;
        const updatedAt = nowIso();
        renderTable(
          tbody,
          rows
            .map((u, idx) => {
              const base = (idx + 1) * 2;
              return `
                <tr>
                  <td>${u.name}</td>
                  <td>${base + 3}</td>
                  <td>${base + 1}</td>
                  <td>${idx % 2}</td>
                  <td>${idx % 3 === 0 ? 1 : 0}</td>
                  <td>${idx % 3 === 1 ? 1 : 0}</td>
                  <td>${0}</td>
                  <td><code>${ym}</code> / <code>${updatedAt}</code></td>
                </tr>
              `;
            })
            .join("")
        );
      }

      show.addEventListener("click", () => {
        setAlert("");
        render();
        setAlert("GET /reports/monthly（モック）: 200 OK");
      });

      reset.addEventListener("click", () => {
        yearMonth.value = "";
        teamId.value = "";
        tbody.innerHTML = "";
        setAlert("");
      });

      if (query.yearMonth) yearMonth.value = query.yearMonth;
    </script>
  </body>
</html>
